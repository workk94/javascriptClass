<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hi {

            /*
            인라인태그  : 크기를 가질 수 없다   
            width: 100px;
            height: 100px;
            
            */
            border: 1px solid black;
            padding: 10px;
            background-color: bisque;
        }

        input{
            width: 100px;
            height: 60px;
        }


        .title {

            display: block;
            width: 100px;
            height: 100px;
            background-color: aqua;
            text-align: center;
        }

        .category{
            display: block;
        }
    </style>
</head>
<body>
    <h2>태그분류</h2>

    <div>블럭태그</div>
    <span>인라인태그</span>
    <input type="text" value="인라인블럭태그"></input>

    <h4>블럭태그 : 너비, 높이 줄 수 있다. 한 줄 차지함</h4>
    <h4>인라인 블럭태그 : 한 줄에 여러개 들어감, 너비, 높이를 줄 수 있다</h4>
    <h4>인라인 : 한줄에 여러개 들어감, 너비, 높이를 줄 수 없다</h4>


    <span class="hi">hello span</span>


    <input type="text"><input type="text"><input type="text">

    <span class="title">알사탕</span>
    <span class="price">14000</span>
    <span class="category">소설</span>
</body>
</html>
